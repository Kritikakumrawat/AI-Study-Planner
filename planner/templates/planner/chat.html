{% extends 'planner/base.html' %}

{% block title %}AI Chat Assistant{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>AI Study Assistant Chat</h1>
    <div class="card">
        <div class="card-body">
            <div id="chat-messages" style="height: 400px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px;">
                {% for chat in chats reversed %}
                <div class="message user-message">
                    <strong>You:</strong> {{ chat.user_message }}
                </div>
                <div class="message ai-message">
                    <strong>AI:</strong> {{ chat.ai_response }}
                </div>
                {% endfor %}
            </div>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="message" class="form-control" placeholder="Ask me anything about studying..." required>
                    <button class="btn btn-primary" type="submit">Send</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.message {
    margin-bottom: 10px;
}
.user-message {
    text-align: right;
}
.ai-message {
    text-align: left;
}
</style>
{% endblock %}
