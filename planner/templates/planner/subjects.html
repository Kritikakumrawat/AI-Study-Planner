{% extends 'planner/base.html' %}
{% block content %}
<h2 class="text-center mb-4">Your Subjects</h2>
<div class="row">
  {% for subject in subjects %}
  <div class="col-md-4">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title">{{ subject.name }}</h5>
        <p class="card-text">Weightage: {{ subject.weightage }}%</p>
        <a href="/studyplan/{{ subject.id }}/" class="btn btn-outline-primary">View Study Plan</a>
      </div>
    </div>
  </div>
  {% empty %}
  <p class="text-center">No subjects yet. Add some from the admin panel.</p>
  {% endfor %}
</div>
{% endblock %}
